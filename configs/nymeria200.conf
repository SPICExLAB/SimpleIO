general: 
{
   exp_dir: experiments/nymeria
}

train:
{
    mode: train
    coordinate: body_coord
    data_list:
    [   
        {
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_body_mag_baro_2imu_200hz_all/train
        data_drive: []
        },
    ]
    gravity: 9.81007
    remove_g: False

    lr: 5e-4
    device: cuda:0
    min_lr: 1e-6
    batch_size: 512
    max_epochs: 80
    patience: 10
    factor: 0.5
    weight_decay: 1e-4

    save_freq: 5
    eval_freq: 1

    weight: 1e2
    cov_weight: 1e-4
    propcov:True
    covaug:False
    loss: Huber_loss005
    rotloss: Huber_loss005
}

test:
{
    mode: test
    coordinate: body_coord
    rot_type: None
    data_list:
    [{
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_body_mag_baro_2imu_200hz_all/test
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: False
    
}

eval:
{    
    mode: evaluate
    coordinate: body_coord
    rot_type: None
    data_list:
    [{
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_body_mag_baro_2imu_200hz_all/eval
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: False
}


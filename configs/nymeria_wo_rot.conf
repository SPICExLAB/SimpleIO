general:
{
   exp_dir: experiments/nymeria_wo_rot
}

train:
{
    mode: train
    coordinate: body_coord
    network: code
    data_list:
    [
        {
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_body_Ty
        data_drive: []
        },
    ]
    gravity: 9.81007
    remove_g: False

    lr: 5e-4
    device: cuda:1
    min_lr: 1e-6
    batch_size: 512
    max_epochs: 100
    patience: 10
    factor: 0.5
    weight_decay: 1e-4
    gradient_clip: 1.0

    save_freq: 5
    eval_freq: 1

    weight: 1e2
    cov_weight: 1e-4
    propcov:True
    covaug:True
    loss: Huber_loss005
    rotloss: Huber_loss005
}

test:
{
    mode: test
    coordinate: body_coord
    network: code
    rot_type: None
    data_list:
    [{
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_test_body_Ty
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: False
}

eval:
{
    mode: evaluate
    coordinate: body_coord
    network: code
    rot_type: None
    data_list:
    [{
        name: Nymeria
        window_size: 250
        step_size: 50
        data_root: /mnt/nas2/processed_data_test_body_Ty
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: False
}
